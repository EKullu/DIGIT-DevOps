# Common Labels
labels:
  app: "uba-ui"
  group: "web"

namespace: egov    

# Ingress Configs
ingress:
  enabled: true
  context: "uba-ui"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "ttpldevops/uba-frontend"
  tag: latest
replicas: "1"
httpPort: 80
healthChecks:
  enabled: false
  livenessProbePath: "/uba-ui/"
  readinessProbePath: "/uba-ui/"

extraVolumes: |
  - name: js-injection
    configMap:
      name: uba-ui-js-injection

extraVolumeMounts: |
  - mountPath: /etc/nginx/conf.d/sub_filter.conf
    name: js-injection
    subPath: sub_filter.conf