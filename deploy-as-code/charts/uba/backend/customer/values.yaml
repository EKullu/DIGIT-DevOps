# Common Labels
labels:
  app: "customer"
  group: "egov"

namespace: egov

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "customer"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "customer_schema"
    image:
      repository: "prsm323/customer-db"
      tag: latest

# Container Configs
image:
  repository: "prsm323/customer"
  tag: latest1
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/customer/health"
  readinessProbePath: "/customer/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms256m"
memory_limits: 384Mi
java-args: ""

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true" 
  {{- end }}
  - name: SERVER_CONTEXT_PATH
    value: /benefits
  - name: SERVER_SERVLET_CONTEXT-PATH
    value: /benefits 
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-service-v2
  {{- if index .Values "java-enable-debug" }}
  - name: JAVA_ENABLE_DEBUG
    value: "true"
  {{- end }}
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  
