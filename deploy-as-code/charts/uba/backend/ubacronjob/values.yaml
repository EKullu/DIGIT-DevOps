
# Common Labels
labels:
  app: "uba-cronjob"
  group: "digit-works"

namespace: works

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "uba-cronjob"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "prsm323/ubacronjob"
  tag: latest
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/ubacronjob/health"
  readinessProbePath: "/ubacronjob/health"
memory_limits: 384Mi

# Additional Container Envs
env: |
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true" 
  {{- end }}
  - name: SERVER_CONTEXT_PATH
    value: /uba-cronjob
  - name: SERVER_SERVLET_CONTEXT-PATH
    value: /uba-cronjob 
  